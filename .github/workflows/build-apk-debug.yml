# Builds the CodeAssist IDE as a DEBUG APK (signed with the auto-generated debug keystore — no repo
# secrets needed). The full Android shell set is included (CI_CORE_ONLY is NOT set), so :ide-android is
# part of the build and this needs a real Android SDK (platform 36 for AGP 9's compileSdk).
name: Build APK (debug)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (AGP 9 / Gradle 9.5)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK + accept licenses
        uses: android-actions/setup-android@v3

      # AGP 9 needs the Android-16 (API 36) platform for compileSdk 36; build-tools are auto-resolved by
      # AGP, but install the matching set explicitly so sdkmanager (not AGP) is the source of truth.
      - name: Install platform 36 (compileSdk) + build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Disable Kotlin incremental compilation for CI (one-shot builds gain nothing from it, and a restored
      # incremental-compilation cache can produce phantom "unresolved reference" errors — see ci.yml).
      - name: Disable Kotlin incremental compilation (CI)
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.incremental=false" >> ~/.gradle/gradle.properties

      # CI_CORE_ONLY must NOT be set: leaving it unset includes :ide-android (the shells). An unset var in
      # the Actions runner is just absent, so nothing to do here beyond not passing the env.
      - name: Assemble debug APK
        run: ./gradlew :ide-android:assembleDebug --console=plain --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: codeassist-debug
          path: |
            ide-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14